name: build
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Fetch libv2ray.aar (Xray core)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p app/libs
          if [ ! -f app/libs/libv2ray.aar ]; then
            gh release download -R 2dust/AndroidLibXrayLite -p '*.aar' -D app/libs
            ls -l app/libs
            [ -f app/libs/libv2ray.aar ] || mv app/libs/*.aar app/libs/libv2ray.aar
          fi
      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon
      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: phoenix-debug-apk
          path: app/build/outputs/apk/debug/*.apk
