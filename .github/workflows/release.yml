name: release
# Выпуск одной командой:  git tag v3.9.65 && git push --tags
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Проверки выпуска
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NAME=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          [ "$VERSION" = "$NAME" ] || { echo "Тег $VERSION не равен versionName $NAME"; exit 1; }
          [ -f "RELEASE_NOTES_${VERSION}.md" ] || { echo "Нет RELEASE_NOTES_${VERSION}.md"; exit 1; }
          . tools/core.lock
          [ -n "$TAG" ] && [ -n "$SHA256" ] || { echo "tools/core.lock не заполнен (TAG и SHA256 ядра)"; exit 1; }

      - name: Ядро Xray по зафиксированной версии
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          . tools/core.lock
          mkdir -p app/libs
          gh release download "$TAG" -R 2dust/AndroidLibXrayLite -p '*.aar' -D app/libs
          [ -f app/libs/libv2ray.aar ] || mv app/libs/*.aar app/libs/libv2ray.aar
          echo "$SHA256  app/libs/libv2ray.aar" | sha256sum -c -

      - name: Ключ подписи
        env:
          KEYSTORE_B64: ${{ secrets.PHOENIX_KEYSTORE_B64 }}
        run: |
          [ -n "$KEYSTORE_B64" ] || { echo "Нет секрета PHOENIX_KEYSTORE_B64"; exit 1; }
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/phoenix.jks"

      - name: Тесты
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Сборка release
        env:
          PHOENIX_KEYSTORE: ${{ runner.temp }}/phoenix.jks
          PHOENIX_STORE_PASSWORD: ${{ secrets.PHOENIX_STORE_PASSWORD }}
          PHOENIX_KEY_PASSWORD: ${{ secrets.PHOENIX_KEY_PASSWORD }}
          PHOENIX_KEY_ALIAS: ${{ secrets.PHOENIX_KEY_ALIAS }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Файлы релиза
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk "dist/phoenix-${VERSION}.apk"
          cp app/build/outputs/mapping/release/mapping.txt "dist/mapping-${VERSION}.txt" || true
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "dist/phoenix-${VERSION}.apk" | tee dist/signing-cert.txt
          (cd dist && sha256sum "phoenix-${VERSION}.apk" > SHA256SUMS.txt)

      - name: Публикация
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" dist/* --title "Phoenix $VERSION" --notes-file "RELEASE_NOTES_${VERSION}.md"
